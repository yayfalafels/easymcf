[pytest]
markers =
    backend: tier 1 — Flask test client, no browser (ARCH-TEST-03)
    frontend: tier 1b — Playwright against mocked /api (ARCH-TEST-09)
    e2e: tier 2 — full stack, Playwright + real backend + seeded db (ARCH-TEST-04)
    live: tier 3 — real MCF site, human-gated, deselected by default (ARCH-TEST-06)
addopts = -m "not live" --timeout=60 --strict-markers
testpaths = tests
