[project]
name = "easymcf-dev-env"
version = "0.1.0"
description = "Dependency manifest for the .dev/dev-env venv — one-time/throwaway development tasks (debug probes, mock-data generation, exploratory scripts). Not a buildable package; installed via `pip install -r` against the dependencies list below, not `pip install .`. See .claude/skills/local-infra-navigation/SKILL.md."
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "ipython",
    "faker",
    "requests",
    "pyflakes",
    "mkdocs==1.6.*",
    "mkdocs-material==9.7.*",
    "pymdown-extensions==10.*",
]
